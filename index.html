
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTI Psychological Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="테마 전환">
        <span class="theme-icon" aria-hidden="true">🌙</span>
        <span class="theme-label" data-theme-label>다크</span>
    </button>
    <div class="container">
        <!-- Start Screen -->
        <div id="start-screen" class="screen active">
            <h1>MBTI 심리테스트</h1>
            <p>간단한 질문에 답하고 나와 닮은 성향을 확인해보자.</p>
            <button id="start-btn">테스트 시작</button>
        </div>

        <!-- Question Screen -->
        <div id="question-screen" class="screen">
            <div class="progress-bar">
                <div id="progress" class="progress"></div>
            </div>
            <h2 id="question-text"></h2>
            <div id="answers-container" class="answers-container">
                <button class="answer-btn" id="answer-a"></button>
                <button class="answer-btn" id="answer-b"></button>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="screen">
            <h1>당신의 유형은</h1>
            <div class="result-card">
                <div class="result-badge">MBTI 결과</div>
                <h2 id="result-type"></h2>
                <p id="result-description"></p>
            </div>
            <button id="restart-btn">다시하기</button>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
