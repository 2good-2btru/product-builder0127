
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTI Psychological Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="테마 전환">
        <span class="theme-icon" aria-hidden="true">🌙</span>
        <span class="theme-label" data-theme-label>다크</span>
    </button>
    <div class="container">
        <!-- Start Screen -->
        <div id="start-screen" class="screen active">
            <h1>MBTI 심리테스트</h1>
            <p>간단한 질문에 답하고 나와 닮은 성향을 확인해보자.</p>
            <button id="start-btn">테스트 시작</button>
        </div>

        <!-- Question Screen -->
        <div id="question-screen" class="screen">
            <div class="progress-bar">
                <div id="progress" class="progress"></div>
            </div>
            <h2 id="question-text"></h2>
            <div id="answers-container" class="answers-container">
                <button class="answer-btn" id="answer-a"></button>
                <button class="answer-btn" id="answer-b"></button>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="screen">
            <h1>당신의 유형은</h1>
            <div class="result-card">
                <div class="result-badge">MBTI 결과</div>
                <h2 id="result-type"></h2>
                <p id="result-description"></p>
            </div>
            <button id="restart-btn">다시하기</button>
        </div>

        <section class="partner-section" aria-labelledby="partner-title">
            <div class="partner-card">
                <div class="partner-badge">Partnership</div>
                <h2 id="partner-title">제휴 문의</h2>
                <p class="partner-subtitle">브랜드/콘텐츠/프로모션 협업을 제안해 주세요.</p>
                <form id="partner-form" class="partner-form" action="https://formspree.io/f/xbdoeedn" method="POST">
                    <input type="hidden" name="_subject" value="MBTI 사이트 제휴 문의">
                    <label class="form-field">
                        <span>담당자명</span>
                        <input type="text" name="name" placeholder="홍길동" required>
                    </label>
                    <label class="form-field">
                        <span>이메일</span>
                        <input type="email" name="email" placeholder="you@company.com" required>
                    </label>
                    <label class="form-field">
                        <span>회사/브랜드</span>
                        <input type="text" name="company" placeholder="회사명" required>
                    </label>
                    <label class="form-field">
                        <span>문의 내용</span>
                        <textarea name="message" rows="5" placeholder="제휴 목적, 기대 효과, 일정 등을 알려주세요." required></textarea>
                    </label>
                    <button class="partner-submit" type="submit">제휴 문의 보내기</button>
                    <p id="partner-status" class="form-status" role="status" aria-live="polite"></p>
                </form>
            </div>
        </section>
    </div>
    <script src="main.js"></script>
</body>
</html>
